name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scoreboard
          POSTGRES_PASSWORD: scoreboard
          POSTGRES_DB: scoreboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoreboard -d scoreboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: pytest tests --ignore=tests/integration -v

      - name: Run integration tests (SQLite + Postgres)
        env:
          TEST_DATABASE_URL: postgresql://scoreboard:scoreboard@localhost:5432/scoreboard
        run: pytest tests/integration -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t sports-scoreboard-backend:ci ./backend
