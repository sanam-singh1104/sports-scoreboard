# Post-deploy verification: push to main -> CI (ci.yml) -> this workflow.
#
# Approach
# --------
# Render deploys main by itself (`autoDeploy: true` in render.yaml): every
# push to main is built and rolled out by Render, in parallel with CI. This
# workflow does NOT deploy anything. It runs after CI finishes for a push to
# main and:
#
#   * CI passed  -> waits for Render to have that commit live (via the Render
#                   API, if configured) and smoke-tests the live URL. A red
#                   run here means the release is broken in production.
#   * CI failed  -> Render has probably deployed that commit anyway, so it
#                   fails loudly with a pointer to the rollback steps.
#
# Deploys are therefore not gated on CI - CI and this smoke test tell you
# *whether* a release is good; see docs/release-process.md for rollback.
#
# Configuration (Settings -> Secrets and variables -> Actions), all optional
# -------------------------------------------------------------------------
#   Variable RENDER_SERVICE_URL  Live URL; default
#                                https://sports-scoreboard-api.onrender.com
#   Secret   RENDER_API_KEY      Render Account Settings -> API Keys
#   Variable RENDER_SERVICE_ID   srv-... (in the service's dashboard URL)
#     With both of these, the job waits until the tested commit is actually
#     live before smoke-testing. Without them it smoke-tests whatever is
#     live after a short wait, which may still be the previous version.

name: Post-deploy smoke test

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Re-check the live service by hand at any time.
  workflow_dispatch:

concurrency:
  group: post-deploy-smoke-test
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICE_URL: ${{ vars.RENDER_SERVICE_URL || 'https://sports-scoreboard-api.onrender.com' }}

jobs:
  smoke-test:
    name: Smoke-test live Render service
    runs-on: ubuntu-latest
    # Only after a *successful* CI run for a *push* to main (not a PR whose
    # head branch happens to be named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL || 'https://sports-scoreboard-api.onrender.com' }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Wait for Render to deploy the tested commit
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          # Render starts building on push, so by the time CI is done the
          # deploy is usually in progress or already live. Give up after 15m.
          for i in $(seq 1 90); do
            status=$(curl -fsS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
              | jq -r --arg sha "$TESTED_SHA" \
                  '[.[].deploy | select(.commit.id == $sha)][0].status // "not_started"')
            echo "[$i] deploy of $TESTED_SHA: $status"
            case "$status" in
              live) exit 0 ;;
              deactivated)
                # A newer commit replaced it - smoke-test what's live now.
                echo "Superseded by a newer deploy."; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled)
                echo "::error::Render deploy of $TESTED_SHA ended with status $status - the previous version is still serving"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Render to deploy $TESTED_SHA"
          exit 1

      - name: Give Render time to roll out (no API key configured)
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        run: |
          echo "::notice::RENDER_API_KEY / RENDER_SERVICE_ID not set - can't confirm $TESTED_SHA is live; testing whatever is serving."
          sleep 60

      - name: Smoke-test live URL
        run: |
          # Free services may be asleep; retry to allow for cold start.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 30 "$SERVICE_URL/api/teams" > /dev/null \
               && curl -fsS --max-time 30 "$SERVICE_URL/api/matches" > /dev/null \
               && curl -fsS --max-time 30 "$SERVICE_URL/api/standings" > /dev/null; then
              echo "Live and healthy at $SERVICE_URL"
              exit 0
            fi
            echo "[$i] not healthy yet, retrying..."
            sleep 10
          done
          echo "::error::$SERVICE_URL did not respond healthy - see docs/release-process.md#rollback"
          exit 1

  ci-failed:
    name: Warn - CI failed on main
    runs-on: ubuntu-latest
    # Render auto-deploys regardless of CI, so a red CI run on main likely
    # means untested code is live.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Flag possible bad deploy
        run: |
          echo "::error::CI failed for ${{ github.event.workflow_run.head_sha }} on main, but Render auto-deploys every push - this commit is probably live. Roll back or push a fix: see docs/release-process.md#rollback"
          exit 1
